name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the repo is developed and device-tested on, so
          # a new stable can't turn CI red on its own; moving to a newer Flutter
          # is a deliberate change.
          flutter-version: 3.47.9

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Unit tests (with coverage)
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  android-unit-test:
    name: Android unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Cache Gradle's downloads: fetching them on every run hit Maven
          # Central's rate limit (HTTP 429) once.
          cache: gradle
          cache-dependency-path: |
            example/android/*.gradle*
            example/android/gradle/wrapper/gradle-wrapper.properties
            android/*.gradle*

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the repo is developed and device-tested on, so
          # a new stable can't turn CI red on its own; moving to a newer Flutter
          # is a deliberate change.
          flutter-version: 3.47.9

      # Generates example/android/local.properties and the plugin wiring the
      # plugin's Gradle module is built through.
      - name: Generate the Android build files
        working-directory: example
        run: flutter build apk --config-only

      - name: Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :light_compressor_v2:testDebugUnitTest
